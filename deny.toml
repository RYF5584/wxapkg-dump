# Configuration for `cargo deny`, used by .github/workflows/audit.yml.
#
# The point of listing licences explicitly is that a new dependency with a surprising licence
# fails the build instead of arriving unnoticed.

[graph]
targets = [
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
# Deny anything with a known advisory unless it is listed below with a reason.
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licences only. Adding a copyleft one is a deliberate decision, not an accident.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    # Certificate trust anchors (webpki-roots) are data, not code.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Nothing in this project may pull in a second copy of a core async or TLS stack.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
