name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release
        run: cargo build --release --workspace --locked

      - name: CLI and MCP smoke test
        shell: bash
        run: |
          ext=""
          [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          exe="target/release/wxapkg-dump${ext}"
          "$exe" --version
          "$exe" doctor --json > /dev/null
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | "$exe" --mcp > mcp.json
          grep -q wxapkg_scan_local_programs mcp.json
          grep -q ilink_download_mini_program mcp.json

  gui:
    name: desktop GUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/wxapkg-gui -> target"

      - name: Install GUI dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev libssl-dev pkg-config

      - name: Format
        run: cargo fmt --manifest-path crates/wxapkg-gui/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path crates/wxapkg-gui/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --manifest-path crates/wxapkg-gui/Cargo.toml --locked

      - name: Build
        run: cargo build --release --manifest-path crates/wxapkg-gui/Cargo.toml --locked

      - name: Verify the committed web UI snapshot
        shell: bash
        run: git diff --exit-code --ignore-cr-at-eol -- crates/wxapkg-gui/webui

  docs:
    name: documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
