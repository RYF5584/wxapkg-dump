name: 缺陷报告
description: 报告一个可复现的缺陷
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。**请先搜索已有 issue**，避免重复。

        安全相关问题请勿在此提交，改用 [SECURITY.md](../SECURITY.md) 中的私有渠道。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 输出 `wxapkg-dump --version`，或填 `main` 分支的提交号
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows (x64)
        - Linux (x64)
        - 其它
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: 出现问题的入口
      options:
        - 命令行
        - API 服务
        - Web 控制台
        - 桌面外壳
        - MCP / Skill
        - 远程下载（iLink）
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请给出确切的命令或点击路径。能贴出完整命令比描述「我点了下载」有用得多。
      placeholder: |
        1. 运行 `wxapkg-dump unpack --appid wx... -o /tmp/out`
        2. 看到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 请**原样粘贴**输出。加了 `--json` 的话请一并附上，它会给出稳定的错误码。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志与诊断信息
      description: |
        `wxapkg-dump doctor` 的输出，以及带 `WXAPKG_LOG=debug` 重跑的结果。
        **请先确认输出里没有你的 appid、账号或路径**。
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已在最新版本上复现
          required: true
        - label: 我已搜索过已有 issue
          required: true
        - label: 我已确认上述内容中不含我的账号凭证或未授权内容
          required: true
