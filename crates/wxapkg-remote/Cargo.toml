[package]
name = "wxapkg-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
directories = { workspace = true }
tracing = { workspace = true }
regex = { workspace = true }
base64 = { workspace = true }
ureq = { workspace = true, default-features = false, features = ["json"] }
native-tls = { workspace = true, optional = true }
p256 = { workspace = true }
aes-gcm = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
flate2 = { workspace = true }
rand = { workspace = true }
tempfile = { workspace = true }
prost = "0.14.3"
md-5 = "0.10.6"
zstd = "0.14.3"

[features]
default = ["native-tls-backend"]
# Android cross-compilation: rustls only, because openssl-sys does not cross-compile
android = ["rustls-backend"]
native-tls-backend = ["ureq/native-tls", "dep:native-tls"]
rustls-backend = ["ureq/tls"]

[build-dependencies]
prost-build = "0.14.3"
protox = "0.9.1"
